
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOKI AI - Your AI Assistant</title>
  <meta name="description" content="Welcome to YOKI AI, an AI assistant created by YOKESH.">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101426;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }
    h1 { color: #65e5ff; font-size: 38px; }
    .card {
      max-width: 500px;
      margin: 30px auto;
      padding: 22px;
      background: #202943;
      border-radius: 18px;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #65e5ff;
      font-size: 16px;
    }
    button {
      margin-top: 12px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #65e5ff;
      color: #101426;
      font-size: 16px;
      font-weight: bold;
    }
    #reply {
      margin-top: 20px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>YOKI AI</h1>
  <p>Your Personal AI Assistant</p>

  <div class="card">
    <h2>Chat with YOKI</h2>
    <input id="message" placeholder="Ask me anything..."
      onkeydown="if(event.key==='Enter') askYoki()">
    <button onclick="askYoki()">Send</button>
    <p id="reply">Hi! I'm YOKI AI. How can I help you?</p>
  </div>

  <p>Created by YOKESH ❤️</p>

  <script>
    function askYoki() {
      const input = document.getElementById("message");
      const msg = input.value.trim().toLowerCase();
      const reply = document.getElementById("reply");

      if (!msg) {
        reply.textContent = "Please type a message!";
      } else if (msg.includes("who created you") ||
                 msg.includes("who made you")) {
        reply.textContent = "I was created by YOKESH!";
      } else if (msg.includes("who is your boss")) {
        reply.textContent = "My boss is YOKESH!";
      } else if (msg.includes("best friend") ||
                 msg.includes("who is your friend")) {
        reply.textContent = "My best friend is Akash!";
      } else if (msg.includes("who are you")) {
        reply.textContent = "I am YOKI AI, your personal AI assistant!";
      } else if (msg === "hi" || msg === "hello" ||
                 msg.startsWith("hey ")) {
        reply.textContent = "Hello! Welcome to YOKI AI!";
      } else if (msg.includes("how are you")) {
        reply.textContent = "I'm fine! How can I help you?";
      } else if (msg.includes("your name")) {
        reply.textContent = "My name is YOKI AI!";
      } else if (msg === "bye" || msg.startsWith("bye ")) {
        reply.textContent = "Bye! Have a great day!";
      } else {
        reply.textContent =
          "I'm still learning! Please ask me another question.";
      }

      input.value = "";
    }
  </script>
</body>
</html>
