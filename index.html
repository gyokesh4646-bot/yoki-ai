<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="HYu1I09EuFpmEjm3ZbRxdJL3CDgj_yrMcCs2rOeNSiA" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOKI AI - Your AI Assistant</title>
  <meta name="description" content="Welcome to YOKI AI, an AI assistant created by YOKESH.">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101426;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }
    h1 { color: #65e5ff; font-size: 38px; }
    .card {
      max-width: 500px;
      margin: 30px auto;
      padding: 22px;
      background: #202943;
      border-radius: 18px;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #65e5ff;
      font-size: 16px;
    }
    button {
      margin-top: 12px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #65e5ff;
      color: #101426;
      font-size: 16px;
      font-weight: bold;
    }
    #reply {
      margin-top: 20px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>YOKI AI</h1>
  <p>Your Personal AI Assistant</p>

  <div class="card">
    <h2>Chat with YOKI</h2>
    <input id="message" placeholder="Ask me anything..."
      onkeydown="if(event.key==='Enter') askYoki()">
    <button onclick="askYoki()">Send</button>
    <p id="reply">Hi! I'm YOKI AI. How can I help you?</p>
  </div>

  <p>Created by YOKESH ❤️</p>

  
<script>
function askYoki() {
  const input = document.getElementById("message");
  const msg = input.value.trim().toLowerCase()
    .replace(/[?!.,]/g, "")
    .replace(/\s+/g, " ");
  const reply = document.getElementById("reply");

  if (!msg) {
    reply.textContent = "Please type a message!";
    return;
  }

  // Greetings
  else if (/^(h+i+|hello+|hey+|hai+|vanakkam)$/.test(msg)) {
    reply.textContent = "Hello!";
  }

  // Goodbye
  else if (/\b(bye|goodbye|see you|see u|good night)\b/.test(msg)) {
    reply.textContent = "Bye! Have a great day!";
  }

  // Boss's best friend
  else if (msg.includes("best friend") ||
           msg.includes("close friend") ||
           msg.includes("who is your friend") ||
           msg.includes("boss friend")) {
    reply.textContent = "My boss's best friend is Akash!";
  }

  // Boss's father
  else if (msg.includes("father") || msg.includes("dad")) {
    reply.textContent = "My boss's father name is K. Gnanam!";
  }

  // Boss's mother
  else if (msg.includes("mother") || msg.includes("mom") ||
           msg.includes("amma")) {
    reply.textContent = "My boss's mother name is G. Deepa!";
  }

  // Boss's first sister
  else if (msg.includes("1st sister") ||
           msg.includes("first sister") ||
           msg.includes("elder sister")) {
    reply.textContent = "My boss's first sister name is G. Geetha!";
  }

  // Boss's second sister
  else if (msg.includes("2nd sister") ||
           msg.includes("second sister") ||
           msg.includes("younger sister")) {
    reply.textContent = "My boss's second sister name is G. Girija!";
  }

  // Boss's name
  else if (msg.includes("boss name") ||
           msg.includes("name of your boss") ||
           msg.includes("who is your boss") ||
           msg.includes("your boss")) {
    reply.textContent = "My boss name is G. Yokesh!";
  }

  // Creator / inventor
  else if (msg.includes("who invented you") ||
           msg.includes("who created you") ||
           msg.includes("who made you") ||
           msg.includes("your creator") ||
           msg.includes("who developed you")) {
    reply.textContent = "I was created by YOKESH!";
  }

  // AI identity
  else if (msg.includes("who are you") ||
           msg.includes("your name")) {
    reply.textContent = "I am YOKI AI, your personal AI assistant!";
  }

  // How are you?
  else if (msg.includes("how are you")) {
    reply.textContent = "I'm fine! How can I help you?";
  }

  else {
    reply.textContent =
      "I'm still learning! Please ask me another question.";
  }

  input.value = "";
}
</script>

</body>
</html>
